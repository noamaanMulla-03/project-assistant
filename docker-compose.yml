# ── Docker Compose — Project Assistant (Dev) ──────────────────────────────────
# Services: PostgreSQL 16, FastAPI backend (hot-reload), Vite frontend (HMR)

services:
    # ── PostgreSQL (with pgvector extension for vector embeddings) ────────────
    db:
        image: pgvector/pgvector:pg16
        container_name: pa-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - pa-network

    # ── FastAPI Backend ─────────────────────────────────────────────────────────
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: pa-backend
        restart: unless-stopped
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            # Mount source without shadowing or duplicating the image's virtual env
            - ./backend/app:/app/app
            - ./backend/alembic:/app/alembic
            - ./backend/tests:/app/tests
            # Persist uploaded knowledge-base files outside the container
            - uploads:/app/uploads
            # Persist HuggingFace model cache so the embedding model is not
            # re-downloaded on every container restart (~90 MB).
            - hf_cache:/root/.cache/huggingface
        depends_on:
            db:
                condition: service_healthy
        networks:
            - pa-network

    # ── Vite Frontend (Dev Server) ──────────────────────────────────────────────
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: pa-frontend
        restart: unless-stopped
        command: npm run dev -- --host 0.0.0.0
        ports:
            - "5173:5173"
        env_file:
            - .env
        volumes:
            # Keep installed dependencies in the image; hot-reload the app source
            - ./frontend/src:/app/src
            - ./frontend/public:/app/public
            - ./frontend/index.html:/app/index.html
        depends_on:
            - backend
        networks:
            - pa-network

volumes:
    pgdata:
    uploads:
    hf_cache:

networks:
    pa-network:
        driver: bridge
